<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="400" fill="#06080E"/>
  <circle cx="200" cy="100" r="250" fill="#3B82F6" fill-opacity="0.08"/>
  <circle cx="1000" cy="300" r="250" fill="#8B5CF6" fill-opacity="0.08"/>
  
  <!-- Outer Card Frame -->
  <rect x="50" y="40" width="1100" height="320" rx="20" fill="#0D1322" stroke="#1E293B" stroke-width="2"/>
  
  <!-- Logo & Title -->
  <rect x="90" y="80" width="60" height="60" rx="16" fill="url(#gradient)"/>
  <path d="M120 98L132 110L120 122L108 110L120 98Z" fill="white"/>
  
  <text x="170" y="115" font-family="Inter, sans-serif" font-weight="800" font-size="42" fill="#F8FAFC">EvalMesh</text>
  <text x="365" y="115" font-family="Inter, sans-serif" font-weight="700" font-size="20" fill="#06B6D4">v0.5.0</text>
  <text x="170" y="145" font-family="Inter, sans-serif" font-weight="600" font-size="18" fill="#94A3B8">AI Gateway for Secure &amp; Reliable Agent Deployment</text>
  
  <!-- Pipeline Diagram -->
  <!-- Box 1: Client -->
  <rect x="90" y="200" width="220" height="110" rx="12" fill="#172036" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="110" y="235" font-family="Inter, sans-serif" font-weight="700" font-size="15" fill="#60A5FA">CLIENT APP</text>
  <text x="110" y="265" font-family="JetBrains Mono, monospace" font-size="13" fill="#94A3B8">Python / TS SDK</text>
  <text x="110" y="285" font-family="JetBrains Mono, monospace" font-size="13" fill="#94A3B8">OpenAI cURL API</text>
  
  <!-- Arrow 1 -->
  <path d="M320 255H360" stroke="#3B82F6" stroke-width="2" stroke-dasharray="4 4"/>
  
  <!-- Box 2: EvalMesh Gateway -->
  <rect x="370" y="180" width="460" height="150" rx="16" fill="#111827" stroke="#06B6D4" stroke-width="2"/>
  <text x="395" y="215" font-family="Inter, sans-serif" font-weight="800" font-size="18" fill="#22D3EE">🛡️ EVALMESH PROXY GATEWAY</text>
  
  <rect x="395" y="235" width="200" height="36" rx="8" fill="#1F2937"/>
  <text x="405" y="258" font-family="Inter, sans-serif" font-weight="600" font-size="12" fill="#F87171">WAF &amp; PII DLP Redactor</text>
  
  <rect x="610" y="235" width="200" height="36" rx="8" fill="#1F2937"/>
  <text x="620" y="258" font-family="Inter, sans-serif" font-weight="600" font-size="12" fill="#34D399">Semantic Cache (3ms)</text>

  <rect x="395" y="280" width="200" height="36" rx="8" fill="#1F2937"/>
  <text x="405" y="303" font-family="Inter, sans-serif" font-weight="600" font-size="12" fill="#FBBF24">Circuit Breaker (Loop)</text>

  <rect x="610" y="280" width="200" height="36" rx="8" fill="#1F2937"/>
  <text x="620" y="303" font-family="Inter, sans-serif" font-weight="600" font-size="12" fill="#C084FC">Auto-Healing Retries</text>
  
  <!-- Arrow 2 -->
  <path d="M840 255H880" stroke="#06B6D4" stroke-width="2" stroke-dasharray="4 4"/>
  
  <!-- Box 3: LLM Providers -->
  <rect x="890" y="200" width="220" height="110" rx="12" fill="#172036" stroke="#10B981" stroke-width="1.5"/>
  <text x="910" y="235" font-family="Inter, sans-serif" font-weight="700" font-size="15" fill="#34D399">UPSTREAM LLMs</text>
  <text x="910" y="265" font-family="JetBrains Mono, monospace" font-size="13" fill="#94A3B8">OpenAI (GPT-4o)</text>
  <text x="910" y="285" font-family="JetBrains Mono, monospace" font-size="13" fill="#94A3B8">Anthropic / DeepSeek</text>

  <!-- Gradients -->
  <defs>
    <linearGradient id="gradient" x1="90" y1="80" x2="150" y2="140" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
</svg>
