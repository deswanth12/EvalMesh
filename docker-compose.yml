version: '3.8'

services:
  evalmesh-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: evalmesh_proxy
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    restart: always

  redis:
    image: redis:7-alpine
    container_name: evalmesh_redis
    ports:
      - "6379:6379"
    restart: always
