# EvalMesh Production Kubernetes Deployment Manifest
# Applies Horizontal Pod Autoscaler (HPA), Ingress, ConfigMap, and Service

apiVersion: v1
kind: Namespace
metadata:
  name: evalmesh-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: evalmesh-config
  namespace: evalmesh-system
data:
  HOST: "0.0.0.0"
  PORT: "8000"
  LOG_LEVEL: "INFO"
  ENABLE_SEMANTIC_CACHE: "true"
  ENABLE_PROMPT_WAF: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: evalmesh-gateway
  namespace: evalmesh-system
  labels:
    app.kubernetes.io/name: evalmesh-gateway
    app.kubernetes.io/part-of: ai-infrastructure
spec:
  replicas: 3
  selector:
    matchLabels:
      app: evalmesh-gateway
  template:
    metadata:
      labels:
        app: evalmesh-gateway
    spec:
      containers:
      - name: evalmesh
        image: evalmesh/gateway:0.5.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        envFrom:
        - configMapRef:
            name: evalmesh-config
        env:
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: llm-credentials
              key: openai-api-key
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 2Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: evalmesh-service
  namespace: evalmesh-system
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: evalmesh-gateway
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: evalmesh-hpa
  namespace: evalmesh-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: evalmesh-gateway
  minReplicas: 3
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
